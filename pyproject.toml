[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbbackup"
version = "0.1.0"
description = "Cross-platform database backup CLI — full backups to S3 with scheduling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dbbackup" }]
keywords = ["backup", "database", "s3", "cli", "typer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer >=0.12",
  "rich >=13.8",
  "boto3 >=1.34",
  "botocore >=1.34",
  "apscheduler >=3.10",
  "httpx >=0.27",
  "platformdirs >=4",
]

[project.optional-dependencies]
dev = [
  "pytest >=8",
  "pytest-mock >=3",
]

[project.scripts]
dbbackup = "dbbackup.cli:app"

[project.urls]
Homepage = "https://github.com/example/dbbackup"

[tool.hatch.build.targets.wheel]
packages = ["dbbackup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# BLE001/S110: broad `except Exception` + `try/except: pass` are intentional
# for V1 resilience (cleanup fallbacks, storage journal fallbacks, CLI password
# fallbacks, scheduler/logging resilience). Narrowing them would change behavior.
# B008: `typer.Option()` in defaults is required by Typer's CLI introspection.
# Others: SIM117/SIM115/TRY203/DTZ005/B017 are style-only test noise where
# auto-fix would add noqa clutter without behavior benefit.
ignore = ["BLE001", "S110", "B008", "SIM117", "SIM115", "TRY203", "DTZ005", "B017"]
