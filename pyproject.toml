[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dbbackup"
version = "0.1.0"
description = "Cross-platform database backup CLI — full backups to S3 with scheduling"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dbbackup" }]
keywords = ["backup", "database", "s3", "cli", "typer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Operating System :: OS Independent",
]
dependencies = [
  "typer >=0.12",
  "rich >=13.8",
  "boto3 >=1.34",
  "botocore >=1.34",
  "apscheduler >=3.10",
  "httpx >=0.27",
  "platformdirs >=4",
]

[project.optional-dependencies]
dev = [
  "pytest >=8",
  "pytest-mock >=3",
]

[project.scripts]
dbbackup = "dbbackup.cli:app"

[project.urls]
Homepage = "https://github.com/example/dbbackup"

[tool.hatch.build.targets.wheel]
packages = ["dbbackup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
